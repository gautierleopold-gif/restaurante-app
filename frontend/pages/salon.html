<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salón - Gestión Restaurante</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
</head>
<body>
  <div id="app-nav"></div>
  <main class="container">
    <div class="flex-between mb16">
      <h2 style="margin:0" data-i18n="page.salon.title">Salón</h2>
      <button class="btn btn-primary" id="new-order-btn" data-i18n="page.salon.newOrderBtn">+ Pedido para retiro / delivery</button>
    </div>
    <div class="room-tabs" id="room-tabs"></div>
    <div class="floor" id="floor"></div>
  </main>

  <script src="/js/socket.io.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const user = requireAuth();
    renderNav();

    let rooms = [];
    let activeRoomId = null;
    document.getElementById("floor").innerHTML = loadingHTML();

    async function loadRooms() {
      const data = await api("/rooms");
      rooms = data.rooms;
      if (!activeRoomId && rooms.length) activeRoomId = rooms[0].id;
      renderTabs();
      renderFloor();
    }

    function renderTabs() {
      const el = document.getElementById("room-tabs");
      el.innerHTML = rooms
        .map(
          (r) =>
            `<button class="btn ${r.id === activeRoomId ? "btn-primary" : ""}" data-room="${r.id}">${r.name}</button>`
        )
        .join("");
      el.querySelectorAll("button").forEach((b) =>
        b.addEventListener("click", () => {
          activeRoomId = b.dataset.room;
          renderTabs();
          renderFloor();
        })
      );
    }

    function statusLabel(s) {
      const fallback = { LIBRE: "Libre", OCUPADA: "Ocupada", RESERVADA: "Reservada", PENDIENTE_PAGO: "Pend. pago" }[s] || s;
      return t(`status.${s}`, fallback);
    }

    function renderFloor() {
      const room = rooms.find((r) => r.id === activeRoomId);
      const floor = document.getElementById("floor");
      if (!room || room.tables.length === 0) {
        floor.innerHTML = `<div class="empty-state">${t("salon.noTables")}</div>`;
        return;
      }
      // pos_x/pos_y son coordenadas libres en píxeles dentro del plano (se
      // editan arrastrando las mesas con el mouse desde Administración →
      // Salón y mesas), no una grilla de celdas.
      const persLabel = t("common.pers");
      floor.innerHTML = room.tables
        .map((table) => {
          const left = table.pos_x;
          const top = table.pos_y;
          const shapeClass = table.shape === "CIRCLE" ? "shape-circle" : "";
          return `
          <div class="table-tile ${table.status.toLowerCase()} ${shapeClass}" style="left:${left}px; top:${top}px; width:${table.width || 108}px; height:${table.height || 88}px" data-table="${table.id}">
            <div class="t-name">${table.name}</div>
            <div class="t-cap">${table.capacity} ${persLabel}</div>
            <span class="pill pill-${table.status.toLowerCase()}">${statusLabel(table.status)}</span>
          </div>`;
        })
        .join("");
      floor.querySelectorAll(".table-tile").forEach((tile) =>
        tile.addEventListener("click", () => onTableClick(tile.dataset.table))
      );
    }

    async function onTableClick(tableId) {
      const room = rooms.find((r) => r.id === activeRoomId);
      const table = room.tables.find((t) => t.id === tableId);

      if (table.status === "LIBRE") {
        const overlay = showModal(`
          <h2>${table.name}</h2>
          <p class="muted">${t("salon.freeTableTitle")}</p>
          <div class="flex-gap" style="flex-wrap:wrap">
            <button class="btn btn-primary" id="open-order">${t("salon.openOrder")}</button>
            <button class="btn" id="mark-reserved">${t("salon.markReserved")}</button>
          </div>
        `);
        overlay.querySelector("#open-order").addEventListener("click", () => {
          location.href = `/pages/pos.html?tableId=${tableId}`;
        });
        overlay.querySelector("#mark-reserved").addEventListener("click", async () => {
          await api(`/tables/${tableId}/status`, { method: "POST", body: { status: "RESERVADA" } });
          closeModal(overlay);
          loadRooms();
        });
        return;
      }

      if (table.status === "RESERVADA") {
        const overlay = showModal(`
          <h2>${table.name}</h2>
          <p class="muted">${t("salon.reservedText")}</p>
          <div class="flex-gap">
            <button class="btn btn-primary" id="open-order">${t("salon.openOrder")}</button>
            <button class="btn" id="free-table">${t("salon.freeTable")}</button>
          </div>
        `);
        overlay.querySelector("#open-order").addEventListener("click", () => {
          location.href = `/pages/pos.html?tableId=${tableId}`;
        });
        overlay.querySelector("#free-table").addEventListener("click", async () => {
          await api(`/tables/${tableId}/status`, { method: "POST", body: { status: "LIBRE" } });
          closeModal(overlay);
          loadRooms();
        });
        return;
      }

      // OCUPADA o PENDIENTE_PAGO: mostrar resumen del pedido abierto
      if (!table.open_order_id) {
        toast(t("salon.tableOccupiedNoOrder"), "error");
        return;
      }
      const { order } = await api(`/orders/${table.open_order_id}`);
      const overlay = showModal(`
        <h2>${table.name} · Pedido #${order.code}</h2>
        <p class="muted small">${t("salon.waiter")}: ${order.waiter_name || "-"}</p>
        <div style="max-height:220px;overflow-y:auto" class="mb16">
          ${
            order.items.length === 0
              ? `<p class="muted small">${t("salon.noProductsYet")}</p>`
              : order.items
                  .filter((i) => !i.canceled)
                  .map(
                    (i) => `<div class="ticket-item"><div class="ti-top"><span>${i.quantity}x ${i.product_name}</span><span>${money(i.unit_price * i.quantity)}</span></div></div>`
                  )
                  .join("")
          }
        </div>
        <div class="ticket-total-row grand"><span>${t("common.total")}</span><span>${money(order.total)}</span></div>
        <div class="flex-gap mt16" style="flex-wrap:wrap">
          <a class="btn btn-primary" href="/pages/pos.html?orderId=${order.id}">${t("salon.viewEditOrder")}</a>
          <a class="btn btn-accent" href="/pages/pos.html?orderId=${order.id}&pay=1">${t("page.pos.pay")}</a>
        </div>
      `);
    }

    document.getElementById("new-order-btn").addEventListener("click", () => {
      location.href = "/pages/pos.html?new=1";
    });

    loadRooms();
    const socket = connectSocket();
    if (socket) {
      socket.on("tables:changed", loadRooms);
      socket.on("order:updated", loadRooms);
    }
    setInterval(loadRooms, 15000);
  </script>
</body>
</html>
