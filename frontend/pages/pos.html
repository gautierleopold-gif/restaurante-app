<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punto de venta - Gestión Restaurante</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    /* Ticket imprimible: oculto en pantalla, se muestra solo al imprimir
       (window.print()), formateado a ancho de impresora de tickets
       (58/80mm). Todo lo demás de la página se oculta durante la impresión. */
    #print-ticket { display: none; }
    @media print {
      body > *:not(#print-ticket) { display: none !important; }
      #print-ticket {
        display: block !important;
        width: 78mm;
        margin: 0;
        font-family: "Courier New", monospace;
        font-size: 12px;
        color: #000;
      }
      #print-ticket .pt-center { text-align: center; }
      #print-ticket .pt-line { border-top: 1px dashed #000; margin: 6px 0; }
      #print-ticket .pt-row { display: flex; justify-content: space-between; gap: 8px; }
      #print-ticket .pt-title { font-weight: bold; font-size: 14px; }
      @page { margin: 4mm; }
    }
  </style>
</head>
<body>
  <div id="app-nav"></div>
  <div class="container" id="setup-container" style="display:none">
    <div class="card" style="max-width:480px;margin:40px auto">
      <h2 data-i18n="pos.newOrderForm.title">Nuevo pedido</h2>
      <div class="field">
        <label data-i18n="pos.newOrderForm.orderTypeLabel">Tipo de pedido</label>
        <select id="order-type">
          <option value="RETIRO" data-i18n="pos.newOrderForm.orderTypePickup">Retiro en el local</option>
          <option value="DELIVERY" data-i18n="pos.newOrderForm.orderTypeDelivery">Delivery</option>
        </select>
      </div>
      <div class="field"><label data-i18n="pos.newOrderForm.customerNameLabel">Nombre del cliente</label><input id="customer-name" /></div>
      <div class="field"><label data-i18n="pos.newOrderForm.phoneLabel">Teléfono</label><input id="customer-phone" /></div>
      <div class="field" id="address-field"><label data-i18n="pos.newOrderForm.addressLabel">Dirección de entrega</label><input id="customer-address" /></div>
      <button class="btn btn-primary" id="create-order-btn" data-i18n="pos.newOrderForm.createBtn">Crear pedido</button>
    </div>
  </div>

  <div class="container" id="pos-container" style="display:none">
    <div class="flex-between mb16">
      <div>
        <h2 style="margin:0" id="order-title">Pedido</h2>
        <div class="muted small" id="order-subtitle"></div>
      </div>
      <a href="/pages/salon.html" class="btn" data-i18n="pos.backToSalon">← Volver al salón</a>
    </div>
    <div class="pos-layout">
      <div class="category-tabs" id="category-tabs"></div>
      <div class="product-grid" id="product-grid"></div>
      <div class="card ticket">
        <h3 style="margin-top:0" data-i18n="page.pos.comanda">Comanda</h3>
        <div id="ticket-items"></div>
        <div class="mt16" id="ticket-totals"></div>
        <div class="flex-gap mt16" style="flex-wrap:wrap" id="ticket-actions"></div>
      </div>
    </div>
  </div>

  <div id="print-ticket"></div>

  <script src="/js/socket.io.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const user = requireRole(["ADMIN", "DUENIO", "ENCARGADO", "CAJERO", "MOZO"]);
    if (user) {
    renderNav();

    const params = new URLSearchParams(location.search);
    let order = null;
    let categories = [];
    let products = [];
    let activeCategoryId = null;
    let branch = null;
    (async () => {
      try {
        const data = await api("/settings/public");
        branch = data.branch;
      } catch (err) {
        branch = null;
      }
    })();
    const canClose = ["ADMIN", "DUENIO", "ENCARGADO", "CAJERO"].includes(user.role);

    // Ticket imprimible / descargable: cualquier rol (mozo incluido) puede
    // imprimir vía el navegador (window.print(), formateado con la hoja de
    // estilos @media print de arriba) o descargar un .txt equivalente para
    // cuando todavía no hay una impresora de tickets conectada.
    function ticketLines() {
      const lines = [];
      lines.push((branch && (branch.legalName || branch.name)) || t("pos.ticket.defaultBranchName", "Restaurante"));
      if (branch && branch.address) lines.push(branch.address);
      if (branch && branch.taxId) lines.push(`${t("pos.ticket.taxIdLabel", "CUIT/NIT")}: ${branch.taxId}`);
      lines.push("--------------------------------");
      lines.push(`${t("pos.ticket.orderLabel", "Pedido")} #${order.code} · ${orderTypeLabel(order.type)}`);
      lines.push(fmtDateTime(order.created_at));
      if (order.table_name) lines.push(`${t("pos.ticket.tableLabel", "Mesa")}: ${(order.room_name || "") + " " + order.table_name}`.trim());
      if (order.customer_name) lines.push(`${t("pos.ticket.customerLabel", "Cliente")}: ${order.customer_name}`);
      if (order.customer_address) lines.push(`${t("pos.ticket.addressLabel", "Dirección")}: ${order.customer_address}`);
      lines.push("--------------------------------");
      order.items
        .filter((it) => !it.canceled)
        .forEach((it) => {
          const lineTotal = it.quantity * (Number(it.unit_price) + it.modifiers.reduce((s, m) => s + Number(m.price), 0));
          lines.push(`${it.quantity}x ${it.product_name}${it.variant_name ? " (" + it.variant_name + ")" : ""}  $${money(lineTotal)}`);
          it.modifiers.forEach((m) =>
            lines.push(`   + ${Number(m.quantity) > 1 ? `${m.quantity}x ` : ""}${m.modifier_name}`)
          );
          if (it.notes) lines.push(`   * ${it.notes}`);
        });
      lines.push("--------------------------------");
      lines.push(`${t("common.subtotal", "Subtotal")}: $${money(order.subtotal)}`);
      if (Number(order.discount_percent) > 0) {
        const discountAmount = (Number(order.subtotal) * Number(order.discount_percent)) / 100;
        lines.push(`${t("common.discount", "Descuento")} (${order.discount_percent}%): -$${money(discountAmount)}`);
      }
      if (Number(order.tax_amount) > 0) {
        const modeSuffix = branch && branch.taxMode === "INCLUSIVE" ? ` (${t("pos.ticket.taxIncluded", "incluido")})` : "";
        lines.push(`${(branch && branch.taxLabel) || t("pos.ticket.taxLabelFallback", "IVA")}${modeSuffix}: $${money(order.tax_amount)}`);
      }
      lines.push(`${t("common.total", "Total").toUpperCase()}: $${money(order.total)}`);
      if (order.payments && order.payments.length > 0) {
        lines.push("--------------------------------");
        order.payments.forEach((p) => lines.push(`${t("pos.ticket.paymentLabel", "Pago")} (${p.method}): $${money(p.amount)}`));
      }
      lines.push("--------------------------------");
      lines.push(t("pos.ticket.thanksMessage", "¡Gracias por su visita!"));
      return lines;
    }

    function renderPrintTicket() {
      const el = document.getElementById("print-ticket");
      if (!order) { el.innerHTML = ""; return; }
      el.innerHTML = ticketLines()
        .map((l) => (l.startsWith("--") ? `<div class="pt-line"></div>` : `<div>${l}</div>`))
        .join("");
      el.querySelector("div")?.classList.add("pt-center", "pt-title");
    }

    function printTicket() {
      renderPrintTicket();
      setTimeout(() => window.print(), 50);
    }

    function downloadTicketTxt() {
      const text = ticketLines().join("\n");
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ticket-${order.code}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function loadMenu() {
      const [catData, prodData] = await Promise.all([api("/menu/categories"), api("/menu/products")]);
      categories = catData.categories.filter((c) => c.active);
      products = prodData.products.filter((p) => p.active);
      if (!activeCategoryId && categories.length) activeCategoryId = categories[0].id;
      renderCategoryTabs();
      renderProductGrid();
    }

    function renderCategoryTabs() {
      const el = document.getElementById("category-tabs");
      el.innerHTML = categories
        .map((c) => `<button class="btn ${c.id === activeCategoryId ? "btn-primary" : ""}" data-cat="${c.id}">${c.name}</button>`)
        .join("");
      el.querySelectorAll("button").forEach((b) =>
        b.addEventListener("click", () => {
          activeCategoryId = b.dataset.cat;
          renderCategoryTabs();
          renderProductGrid();
        })
      );
    }

    function renderProductGrid() {
      const el = document.getElementById("product-grid");
      const list = products.filter((p) => p.category_id === activeCategoryId);
      if (list.length === 0) {
        el.innerHTML = `<div class="empty-state">${t("pos.productGrid.empty", "No hay productos en esta categoría.")}</div>`;
        return;
      }
      el.innerHTML = list
        .map(
          (p) => `
        <div class="product-card" data-product="${p.id}">
          <div class="p-name">${p.name}</div>
          <div class="p-price">$${money(p.base_price)}</div>
        </div>`
        )
        .join("");
      el.querySelectorAll(".product-card").forEach((card) =>
        card.addEventListener("click", () => openAddItemModal(card.dataset.product))
      );
    }

    function openAddItemModal(productId) {
      const product = products.find((p) => p.id === productId);
      const hasVariants = product.variants && product.variants.length > 0;
      const allGroups = product.modifierGroups || [];
      const groups = allGroups.filter((g) => !g.split_mode);
      // Grupos "de reparto" (ej. sabores): en vez de tildar opciones, se
      // reparte la cantidad total del ítem entre ellas (4 J&Q + 2 carne + 6
      // verdura y queso = 12), aplicable a cualquier producto que los tenga.
      const splitGroups = allGroups.filter((g) => g.split_mode);

      const variantHtml = hasVariants
        ? `<div class="field"><label>${t("pos.addItemModal.variantLabel", "Variante")}</label><select id="variant-select">
            ${product.variants.map((v) => `<option value="${v.id}" data-price="${v.price}">${v.name} - $${money(v.price)}</option>`).join("")}
          </select></div>`
        : "";

      const groupsHtml = groups
        .map(
          (g) => `
        <div class="field">
          <label>${g.name}${g.required ? ` (${t("pos.addItemModal.requiredSuffix", "obligatorio")})` : ""} — ${g.max === 1 ? t("pos.addItemModal.chooseOne", "elegí una opción") : t("pos.addItemModal.chooseUpTo", "elegí hasta {max}", { max: g.max })}</label>
          ${g.modifiers
            .map(
              (m) => `
            <label class="small" style="display:flex;align-items:center;gap:6px;font-weight:normal">
              <input type="${g.max === 1 ? "radio" : "checkbox"}" name="group-${g.id}" value="${m.id}" data-price="${m.price}" data-group="${g.id}" data-max="${g.max}" />
              ${m.name} ${Number(m.price) > 0 ? `(+$${money(m.price)})` : ""}
            </label>`
            )
            .join("")}
        </div>`
        )
        .join("");

      const splitGroupsHtml = splitGroups
        .map(
          (g) => `
        <div class="field split-group" data-split-group="${g.id}">
          <label>${g.name} — ${t("pos.addItemModal.splitInstructions", "repartí la cantidad total entre las opciones")}</label>
          ${g.modifiers
            .map(
              (m) => `
            <div class="flex-gap" style="align-items:center">
              <span class="small" style="flex:1">${m.name}</span>
              <input type="number" class="split-qty" data-modifier="${m.id}" data-group="${g.id}" value="0" min="0" style="width:70px" />
            </div>`
            )
            .join("")}
          <p class="small muted" data-split-total="${g.id}">${t("pos.addItemModal.splitProgressLabel", "Repartido")}: 0 / <span class="qty-echo">1</span></p>
        </div>`
        )
        .join("");

      const overlay = showModal(`
        <h2>${product.name}</h2>
        ${variantHtml}
        ${groupsHtml}
        <div class="field"><label>${t("pos.addItemModal.quantityLabel", "Cantidad")}</label><input type="number" id="qty-input" value="1" min="1" /></div>
        ${splitGroupsHtml}
        <div class="field"><label>${t("pos.addItemModal.notesLabel", "Observaciones")}</label><textarea id="notes-input" rows="2" placeholder="${t("pos.addItemModal.notesPlaceholder", "Ej: sin sal, para llevar aparte...")}"></textarea></div>
        <div class="flex-gap mt16">
          <button class="btn btn-primary" id="confirm-add">${t("pos.addItemModal.confirmBtn", "Agregar a la comanda")}</button>
          <button class="btn" id="cancel-add">${t("btn.cancel", "Cancelar")}</button>
        </div>
      `);

      overlay.querySelectorAll('input[type=checkbox]').forEach((box) => {
        box.addEventListener("change", () => {
          const groupId = box.dataset.group;
          const max = Number(box.dataset.max);
          const checked = overlay.querySelectorAll(`input[data-group="${groupId}"]:checked`);
          if (checked.length > max) box.checked = false;
        });
      });

      function updateSplitTotals() {
        const qty = Number(overlay.querySelector("#qty-input").value) || 1;
        splitGroups.forEach((g) => {
          const inputs = overlay.querySelectorAll(`.split-qty[data-group="${g.id}"]`);
          const sum = Array.from(inputs).reduce((s, i) => s + (Number(i.value) || 0), 0);
          const label = overlay.querySelector(`[data-split-total="${g.id}"]`);
          label.querySelector(".qty-echo").textContent = qty;
          label.firstChild.textContent = `${t("pos.addItemModal.splitProgressLabel", "Repartido")}: ${sum} / `;
          label.style.color = sum === qty ? "" : "#c0392b";
        });
      }
      overlay.querySelectorAll(".split-qty").forEach((inp) => inp.addEventListener("input", updateSplitTotals));
      overlay.querySelector("#qty-input").addEventListener("input", updateSplitTotals);
      updateSplitTotals();

      overlay.querySelector("#cancel-add").addEventListener("click", () => closeModal(overlay));
      overlay.querySelector("#confirm-add").addEventListener("click", async () => {
        const variantId = hasVariants ? overlay.querySelector("#variant-select").value : null;
        const modifierIds = Array.from(overlay.querySelectorAll('input[type="radio"]:checked, input[type="checkbox"]:checked')).map((i) => i.value);
        const quantity = Number(overlay.querySelector("#qty-input").value) || 1;
        const notes = overlay.querySelector("#notes-input").value.trim();

        // validar obligatorios
        for (const g of groups) {
          if (g.required) {
            const anyChecked = overlay.querySelectorAll(`input[data-group="${g.id}"]:checked`).length;
            if (anyChecked === 0) {
              toast(t("pos.addItemModal.chooseOptionError", 'Elegí una opción para "{name}".', { name: g.name }), "error");
              return;
            }
          }
        }

        // Validar y armar el reparto de sabores (si el producto tiene algún
        // grupo split_mode): la suma tiene que dar exactamente la cantidad.
        const flavorSplit = [];
        for (const g of splitGroups) {
          const inputs = overlay.querySelectorAll(`.split-qty[data-group="${g.id}"]`);
          const entries = Array.from(inputs)
            .map((i) => ({ modifierId: i.dataset.modifier, quantity: Number(i.value) || 0 }))
            .filter((e) => e.quantity > 0);
          const sum = entries.reduce((s, e) => s + e.quantity, 0);
          const anyEntered = sum > 0;
          if (anyEntered && sum !== quantity) {
            toast(
              t("pos.addItemModal.splitSumError", 'El reparto de "{name}" debe sumar {quantity} (suma actual: {sum}).', {
                name: g.name,
                quantity,
                sum,
              }),
              "error"
            );
            return;
          }
          if (g.required && !anyEntered) {
            toast(t("pos.addItemModal.splitRequiredError", 'Repartí la cantidad entre las opciones de "{name}".', { name: g.name }), "error");
            return;
          }
          flavorSplit.push(...entries);
        }

        try {
          await api(`/orders/${order.id}/items`, {
            method: "POST",
            body: { productId, variantId, quantity, notes: notes || undefined, modifierIds, flavorSplit },
          });
          closeModal(overlay);
          await refreshOrder();
          toast(t("pos.addItemModal.addedToast", "Producto agregado."), "success");
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    function renderTicket() {
      document.getElementById("order-title").textContent = `${t("pos.ticket.orderLabel", "Pedido")} #${order.code} · ${orderTypeLabel(order.type)}`;
      const subtitleParts = [];
      if (order.table_name) subtitleParts.push(`${order.room_name || ""} ${order.table_name}`.trim());
      if (order.customer_name) subtitleParts.push(order.customer_name);
      if (order.customer_address) subtitleParts.push(order.customer_address);
      subtitleParts.push(`${t("salon.waiter", "Mozo")}: ${order.waiter_name || "-"}`);
      subtitleParts.push(`${t("common.status", "Estado")}: ${t("order.status." + order.status, order.status)}`);
      document.getElementById("order-subtitle").textContent = subtitleParts.join(" · ");

      const itemsEl = document.getElementById("ticket-items");
      if (order.items.length === 0) {
        itemsEl.innerHTML = `<p class="muted small">${t("pos.ticket.noItemsYet", "Todavía no agregaste productos.")}</p>`;
      } else {
        itemsEl.innerHTML = order.items
          .map((it) => {
            const modsTxt = it.modifiers
              .map((m) => (Number(m.quantity) > 1 ? `${m.quantity}x ${m.modifier_name}` : m.modifier_name))
              .join(", ");
            const lineTotal = it.quantity * (Number(it.unit_price) + it.modifiers.reduce((s, m) => s + Number(m.price), 0));
            return `
            <div class="ticket-item" style="${it.canceled ? "opacity:.45;text-decoration:line-through" : ""}">
              <div class="ti-top">
                <span>${it.quantity}x ${it.product_name}${it.variant_name ? " (" + it.variant_name + ")" : ""}</span>
                <span>$${money(lineTotal)}</span>
              </div>
              ${modsTxt ? `<div class="ti-mods">${modsTxt}</div>` : ""}
              ${it.notes ? `<div class="ti-mods">📝 ${it.notes}</div>` : ""}
              <div class="ti-mods">
                ${it.canceled ? `${t("pos.ticket.canceledLabel", "Anulado")}: ${it.cancel_reason || ""}` : it.sent_at ? `<span class="pill pill-${it.kitchen_status.toLowerCase()}">${t("kitchen.status." + it.kitchen_status, it.kitchen_status)}</span>` : t("pos.ticket.notSentToKitchen", "Sin enviar a cocina")}
                ${!it.canceled ? ` · <a href="#" data-cancel-item="${it.id}">${t("pos.ticket.cancelLink", "anular")}</a>` : ""}
              </div>
            </div>`;
          })
          .join("");

        // Anular un ítem requiere el permiso "orders:cancelItem". Si el
        // usuario logueado no lo tiene (por ejemplo un Mozo), se le ofrece
        // pedir la autorización de un Encargado/Dueño/Admin ahí mismo en vez
        // de simplemente fallar.
        itemsEl.querySelectorAll("[data-cancel-item]").forEach((link) =>
          link.addEventListener("click", async (e) => {
            e.preventDefault();
            const reason = prompt(t("pos.cancelItemPrompt", "Motivo de la anulación:"));
            if (!reason) return;
            try {
              await apiWithOverride(
                `/orders/${order.id}/items/${link.dataset.cancelItem}/cancel`,
                { method: "POST", body: { reason } },
                "orders:cancelItem"
              );
              await refreshOrder();
            } catch (err) {
              toast(err.message, "error");
            }
          })
        );
      }

      const totalsEl = document.getElementById("ticket-totals");
      const discountAmount = (Number(order.subtotal) * Number(order.discount_percent)) / 100;
      const taxAmount = Number(order.tax_amount || 0);
      // El motivo del descuento solo se muestra a roles de gerencia: quien
      // aplica el descuento lo carga, pero no necesariamente necesita verlo
      // reflejado todo el tiempo en el ticket (evita que se vuelva ruido para
      // mozos/cajeros); el gerente sí puede auditar por qué se dio.
      const canSeeDiscountReason = ["ADMIN", "DUENIO", "ENCARGADO"].includes(user.role);
      totalsEl.innerHTML = `
        <div class="ticket-total-row"><span>${t("common.subtotal", "Subtotal")}</span><span>$${money(order.subtotal)}</span></div>
        ${Number(order.discount_percent) > 0 ? `<div class="ticket-total-row"><span>${t("common.discount", "Descuento")} (${order.discount_percent}%)</span><span>-$${money(discountAmount)}</span></div>` : ""}
        ${Number(order.discount_percent) > 0 && canSeeDiscountReason ? `<div class="ticket-total-row small muted" style="margin-top:-6px"><span>${t("pos.reasonLabel", "Motivo")}: ${order.discount_reason ? order.discount_reason : t("pos.reasonUnspecified", "(sin especificar)")}</span><span></span></div>` : ""}
        ${taxAmount > 0 ? `<div class="ticket-total-row small muted"><span>${branch?.taxLabel || t("pos.ticket.taxLabelFallback", "IVA")}${branch?.taxMode === "INCLUSIVE" ? ` (${t("pos.ticket.taxIncluded", "incluido")})` : ""}</span><span>$${money(taxAmount)}</span></div>` : ""}
        <div class="ticket-total-row grand"><span>${t("common.total", "Total")}</span><span>$${money(order.total)}</span></div>
        ${order.payments.length > 0 ? `<div class="ticket-total-row small muted"><span>${t("pos.paidLabel", "Pagado")}</span><span>$${money(order.totalPaid)}</span></div>` : ""}
      `;

      renderActions();
    }

    function orderTypeLabel(orderType) {
      return (
        {
          SALON: t("pos.orderType.salon", "Salón"),
          RETIRO: t("pos.orderType.retiro", "Retiro"),
          DELIVERY: t("pos.orderType.delivery", "Delivery"),
        }[orderType] || orderType
      );
    }

    const canInvoice = ["ADMIN", "DUENIO", "ENCARGADO", "CAJERO"].includes(user.role);

    function renderActions() {
      const el = document.getElementById("ticket-actions");
      if (order.status !== "ABIERTO") {
        let html = `<span class="pill pill-entregado">${t("pos.actions.orderStatusPill", { status: t("order.status." + order.status, order.status) })}</span>`;
        if (order.status === "CERRADO" && canInvoice) {
          if (!order.invoice) {
            html += ` <button class="btn btn-sm btn-primary" id="issue-invoice-btn">${t("pedidos.issueModal.confirmBtn", "Emitir factura")}</button>`;
          } else {
            html += ` <span class="small muted">${t("pos.actions.invoiceNumberLabel", { number: order.invoice.number })}</span>
              <a class="btn btn-sm" href="/api/orders/${order.id}/invoice/pdf" target="_blank" id="download-invoice-link">${t("pos.actions.downloadPdfBtn", "Descargar PDF")}</a>
              <button class="btn btn-sm" id="email-invoice-btn">${t("pos.actions.emailInvoiceBtn", "Enviar por mail")}</button>`;
          }
        }
        html += ` <button class="btn btn-sm" id="print-ticket-btn">🖨️ ${t("pos.actions.printTicketBtn", "Imprimir ticket")}</button>`;
        html += ` <button class="btn btn-sm" id="download-ticket-btn">${t("pos.actions.downloadTicketBtn", "Descargar ticket (.txt)")}</button>`;
        html += ` <a class="btn btn-sm" href="/pages/salon.html" id="back-to-salon-link">${t("pos.actions.backToSalonBtn", "Volver al salón")}</a>`;
        el.innerHTML = html;
        el.querySelector("#print-ticket-btn").addEventListener("click", printTicket);
        el.querySelector("#download-ticket-btn").addEventListener("click", downloadTicketTxt);
        if (order.status === "CERRADO" && canInvoice && !order.invoice) {
          el.querySelector("#issue-invoice-btn").addEventListener("click", openIssueInvoiceModal);
        }
        if (order.status === "CERRADO" && canInvoice && order.invoice) {
          // El link de descarga necesita el token; como es un <a> normal, lo
          // interceptamos para pedirlo con fetch y forzar la descarga con
          // el header de autorización correspondiente.
          el.querySelector("#download-invoice-link").addEventListener("click", async (e) => {
            e.preventDefault();
            try {
              const res = await fetch(`/api/orders/${order.id}/invoice/pdf`, {
                headers: { Authorization: `Bearer ${getToken()}` },
              });
              if (!res.ok) throw new Error(t("pedidos.downloadError", "No se pudo descargar la factura."));
              const blob = await res.blob();
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = `factura-${order.invoice.number}.pdf`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              URL.revokeObjectURL(url);
            } catch (err) {
              toast(err.message, "error");
            }
          });
          el.querySelector("#email-invoice-btn").addEventListener("click", async () => {
            const email = prompt(t("pos.actions.emailInvoicePrompt", "Enviar factura al email:"), order.invoice.customer_email || order.customer_email || "");
            if (!email) return;
            try {
              await api(`/orders/${order.id}/invoice/email`, { method: "POST", body: { email } });
              toast(t("pos.actions.invoiceEmailedToast", "Factura enviada por mail."), "success");
            } catch (err) {
              toast(err.message, "error");
            }
          });
        }
        return;
      }
      const pendingToSend = order.items.some((i) => !i.canceled && !i.sent_at);
      let html = "";
      if (pendingToSend) html += `<button class="btn btn-accent" id="send-kitchen-btn" data-i18n="page.pos.sendKitchen">${t("page.pos.sendKitchen")}</button>`;
      html += `<button class="btn" id="discount-btn" data-i18n="page.pos.applyDiscount">${t("page.pos.applyDiscount")}</button>`;
      if (order.table_id) html += `<button class="btn" id="request-bill-btn" data-i18n="page.pos.requestBill">${t("page.pos.requestBill")}</button>`;
      html += `<button class="btn btn-primary" id="pay-btn" data-i18n="page.pos.pay">${t("page.pos.pay")}</button>`;
      html += `<button class="btn btn-danger" id="cancel-order-btn" data-i18n="page.pos.cancelOrder">${t("page.pos.cancelOrder")}</button>`;
      html += `<button class="btn btn-sm" id="print-ticket-btn">🖨️ ${t("pos.actions.printTicketBtn", "Imprimir ticket")}</button>`;
      html += `<button class="btn btn-sm" id="download-ticket-btn">${t("pos.actions.downloadTicketBtn", "Descargar ticket (.txt)")}</button>`;
      el.innerHTML = html;
      el.querySelector("#print-ticket-btn").addEventListener("click", printTicket);
      el.querySelector("#download-ticket-btn").addEventListener("click", downloadTicketTxt);

      if (pendingToSend)
        el.querySelector("#send-kitchen-btn").addEventListener("click", async () => {
          try {
            await api(`/orders/${order.id}/send-to-kitchen`, { method: "POST" });
            toast(t("pos.sentToKitchenToast", "Comanda enviada a cocina."), "success");
            await refreshOrder();
          } catch (err) {
            toast(err.message, "error");
          }
        });

      // Aplicar un descuento requiere el permiso "orders:discount". Si el
      // usuario no lo tiene, se le ofrece pedir autorización de un
      // supervisor en el momento (ver requestManagerOverride en api.js).
      el.querySelector("#discount-btn").addEventListener("click", () => {
        const overlay = showModal(`
          <h2>${t("page.pos.applyDiscount", "Aplicar descuento")}</h2>
          <div class="field"><label>${t("pos.discountModal.percentLabel", "Porcentaje (%)")}</label><input type="number" id="discount-percent" min="0" max="100" value="${order.discount_percent}" /></div>
          <div class="field"><label>${t("pos.reasonLabel", "Motivo")}</label><input id="discount-reason" value="${order.discount_reason || ""}" /></div>
          <button class="btn btn-primary" id="apply-discount">${t("pos.discountModal.applyBtn", "Aplicar")}</button>
        `);
        overlay.querySelector("#apply-discount").addEventListener("click", async () => {
          try {
            await apiWithOverride(
              `/orders/${order.id}/discount`,
              {
                method: "POST",
                body: {
                  percent: Number(overlay.querySelector("#discount-percent").value),
                  reason: overlay.querySelector("#discount-reason").value,
                },
              },
              "orders:discount"
            );
            closeModal(overlay);
            await refreshOrder();
          } catch (err) {
            toast(err.message, "error");
          }
        });
      });

      if (order.table_id)
        el.querySelector("#request-bill-btn").addEventListener("click", async () => {
          await api(`/orders/${order.id}/request-bill`, { method: "POST" });
          toast(t("pos.requestBillToast", "Se marcó la mesa como pendiente de pago."), "success");
        });

      el.querySelector("#pay-btn").addEventListener("click", openPayModal);

      // Cancelar el pedido completo requiere "orders:cancelItem" también
      // (misma permiso elevada que anular un ítem).
      el.querySelector("#cancel-order-btn").addEventListener("click", async () => {
        const reason = prompt(t("pos.cancelOrderPrompt", "Motivo de la cancelación del pedido:"));
        if (!reason) return;
        try {
          await apiWithOverride(`/orders/${order.id}/cancel`, { method: "POST", body: { reason } }, "orders:cancelItem");
          toast(t("pos.orderCanceledToast", "Pedido cancelado."), "success");
          setTimeout(() => (location.href = "/pages/salon.html"), 700);
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    function openIssueInvoiceModal() {
      const overlay = showModal(`
        <h2>${t("pedidos.issueModal.title", { code: order.code })}</h2>
        <p class="small muted">${t("pedidos.issueModal.hint", "Se genera con el próximo número correlativo configurado en Administración → Parámetros.")}</p>
        <div class="field"><label>${t("pedidos.issueModal.nameLabel", "Nombre / razón social del cliente")}</label><input id="inv-name" value="${order.customer_name || ""}" /></div>
        <div class="field"><label>${t("pedidos.issueModal.taxIdLabel", "NIT / identificación fiscal del cliente (opcional)")}</label><input id="inv-taxid" /></div>
        <div class="field"><label>${t("pedidos.issueModal.emailLabel", "Email del cliente (opcional, para poder enviarla por mail)")}</label><input id="inv-email" type="email" value="${order.customer_phone && order.customer_phone.includes("@") ? "" : ""}" /></div>
        <button class="btn btn-primary" id="confirm-issue-invoice">${t("pedidos.issueModal.confirmBtn", "Emitir factura")}</button>
      `);
      overlay.querySelector("#confirm-issue-invoice").addEventListener("click", async () => {
        try {
          await api(`/orders/${order.id}/invoice`, {
            method: "POST",
            body: {
              customerName: overlay.querySelector("#inv-name").value || undefined,
              customerTaxId: overlay.querySelector("#inv-taxid").value || undefined,
              customerEmail: overlay.querySelector("#inv-email").value || undefined,
            },
          });
          closeModal(overlay);
          await refreshOrder();
          toast(t("pedidos.issueSuccess", "Factura emitida."), "success");
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    function openPayModal() {
      const remaining = Math.max(0, Number(order.total) - Number(order.totalPaid));
      const overlay = showModal(`
        <h2>${t("pos.payModal.title", { code: order.code })}</h2>
        <p>${t("common.total", "Total")}: <strong>$${money(order.total)}</strong> · ${t("pos.paidLabel", "Pagado")}: $${money(order.totalPaid)} · ${t("pos.payModal.remainingLabel", "Falta")}: <strong>$${money(remaining)}</strong></p>
        <div class="field"><label>${t("pos.payModal.methodLabel", "Medio de pago")}</label>
          <select id="pay-method">
            <option value="EFECTIVO">${t("pos.payMethod.EFECTIVO", "Efectivo")}</option>
            <option value="TARJETA">${t("pos.payMethod.TARJETA", "Tarjeta")}</option>
            <option value="TRANSFERENCIA">${t("pos.payMethod.TRANSFERENCIA", "Transferencia")}</option>
            <option value="DIGITAL">${t("pos.payMethod.DIGITAL", "Pago digital")}</option>
            <option value="OTRO">${t("pos.payMethod.OTRO", "Otro")}</option>
          </select>
        </div>
        <div class="field"><label>${t("pos.payModal.amountLabel", "Monto")}</label><input type="number" id="pay-amount" value="${remaining.toFixed(2)}" min="0.01" step="0.01" /></div>
        <p class="small muted">${t("pos.payModal.hint", "Podés registrar varios pagos (dividir la cuenta entre distintos medios o personas) hasta cubrir el total.")}</p>
        <div class="flex-gap">
          <button class="btn btn-primary" id="register-pay">${t("pos.payModal.registerBtn", "Registrar pago")}</button>
          ${canClose ? `<button class="btn btn-accent" id="close-order">${order.table_id ? t("pos.payModal.closeTableBtn", "Registrar y cerrar mesa") : t("pos.payModal.closeOrderBtn", "Registrar y cerrar pedido")}</button>` : ""}
        </div>
      `);

      async function registerPayment() {
        const method = overlay.querySelector("#pay-method").value;
        const amount = Number(overlay.querySelector("#pay-amount").value);
        if (!amount || amount <= 0) {
          toast(t("pos.payModal.invalidAmountError", "Ingresá un monto válido."), "error");
          return false;
        }
        await api(`/orders/${order.id}/payments`, { method: "POST", body: { method, amount } });
        return true;
      }

      overlay.querySelector("#register-pay").addEventListener("click", async () => {
        try {
          const ok = await registerPayment();
          if (!ok) return;
          closeModal(overlay);
          await refreshOrder();
          toast(t("pos.payModal.paymentRegisteredToast", "Pago registrado."), "success");
          openPayModal2Continue();
        } catch (err) {
          toast(err.message, "error");
        }
      });

      function openPayModal2Continue() {
        // si aún falta pagar, reabrir el modal actualizado
        if (Number(order.total) - Number(order.totalPaid) > 0.01) openPayModal();
      }

      if (canClose) {
        overlay.querySelector("#close-order").addEventListener("click", async () => {
          try {
            const ok = await registerPayment();
            if (!ok) return;
            await refreshOrder();
            // El pago recién registrado puede haber cerrado el pedido
            // automáticamente (y liberado la mesa) si cubrió el total; en ese
            // caso no hace falta llamar a /close aparte.
            if (order.status === "ABIERTO") {
              await api(`/orders/${order.id}/close`, { method: "POST" });
            }
            closeModal(overlay);
            toast(order.table_id ? t("pos.payModal.tableFreedToast", "Pedido cobrado y mesa liberada.") : t("pos.payModal.orderClosedToast", "Pedido cobrado y cerrado."), "success");
            // No navegamos automáticamente: el pedido queda cerrado en esta
            // misma pantalla para poder emitir la factura al toque si hace
            // falta. Quien quiera volver al salón tiene un botón para eso en
            // las acciones del pedido (ver renderActions).
            await refreshOrder();
          } catch (err) {
            toast(err.message, "error");
          }
        });
      }
    }

    async function refreshOrder() {
      const data = await api(`/orders/${order.id}`);
      order = data.order;
      renderTicket();
    }

    async function init() {
      if (params.get("orderId")) {
        const data = await api(`/orders/${params.get("orderId")}`);
        order = data.order;
      } else if (params.get("tableId")) {
        const data = await api("/orders", { method: "POST", body: { type: "SALON", tableId: params.get("tableId") } });
        order = data.order;
      } else if (params.get("new")) {
        document.getElementById("setup-container").style.display = "block";
        return;
      } else {
        location.href = "/pages/salon.html";
        return;
      }
      document.getElementById("pos-container").style.display = "block";
      await loadMenu();
      renderTicket();
      if (params.get("pay")) openPayModal();

      const socket = connectSocket();
      if (socket) {
        socket.on("order:updated", (updated) => {
          if (updated.id === order.id) {
            order = updated;
            renderTicket();
          }
        });
      }
    }

    document.getElementById("order-type").addEventListener("change", (e) => {
      document.getElementById("address-field").style.display = e.target.value === "DELIVERY" ? "block" : "none";
    });

    document.getElementById("create-order-btn").addEventListener("click", async () => {
      const type = document.getElementById("order-type").value;
      const customerName = document.getElementById("customer-name").value.trim();
      const customerPhone = document.getElementById("customer-phone").value.trim();
      const customerAddress = document.getElementById("customer-address").value.trim();
      if (type === "DELIVERY" && !customerAddress) {
        toast(t("pos.newOrderForm.addressRequiredError", "Ingresá la dirección de entrega."), "error");
        return;
      }
      try {
        const data = await api("/orders", {
          method: "POST",
          body: {
            type,
            customerName,
            customerPhone,
            customerAddress: type === "DELIVERY" ? customerAddress : "",
          },
        });
        order = data.order;
        document.getElementById("setup-container").style.display = "none";
        document.getElementById("pos-container").style.display = "block";
        await loadMenu();
        renderTicket();
        const socket = connectSocket();
        if (socket) {
          socket.on("order:updated", (updated) => {
            if (updated.id === order.id) {
              order = updated;
              renderTicket();
            }
          });
        }
      } catch (err) {
        toast(err.message, "error");
      }
    });

    init();
    } // fin del bloque "if (user)"
  </script>
</body>
</html>
