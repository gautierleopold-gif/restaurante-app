<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración - Gestión Restaurante</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app-nav"></div>
  <div class="container">
    <h2 class="mb16" data-i18n="page.admin.title">Administración</h2>
    <div class="tabs" id="tabs">
      <button data-tab="productos" class="active" data-i18n="tab.productos">Productos</button>
      <button data-tab="categorias" data-i18n="tab.categorias">Categorías</button>
      <button data-tab="adicionales" data-i18n="tab.adicionales">Adicionales</button>
      <button data-tab="estaciones" data-i18n="tab.estaciones">Estaciones de cocina</button>
      <button data-tab="salon" data-i18n="tab.salon">Salón y mesas</button>
      <button data-tab="inventario" data-i18n="tab.inventario">Inventario</button>
      <button data-tab="reportes" data-i18n="tab.reportes">Reportes</button>
      <button data-tab="usuarios" id="tab-usuarios" style="display:none" data-i18n="tab.usuarios">Usuarios</button>
      <button data-tab="permisos" id="tab-permisos" style="display:none" data-i18n="tab.permisos">Permisos</button>
      <button data-tab="parametros" id="tab-parametros" style="display:none" data-i18n="tab.parametros">Parámetros</button>
      <button data-tab="plantillas" id="tab-plantillas" style="display:none" data-i18n="tab.plantillas">Plantillas de factura</button>
      <button data-tab="auditoria" id="tab-auditoria" style="display:none" data-i18n="tab.auditoria">Auditoría</button>
    </div>
    <div id="tab-content"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const user = requireRole(["ADMIN", "DUENIO", "ENCARGADO"]);
    // Si el usuario no tiene el rol requerido, requireRole ya reemplazó el
    // contenido de la página por un mensaje de "Acceso restringido". El resto
    // del script queda dentro de este bloque para no tocar elementos del DOM
    // que ya no existen en ese caso.
    if (user) {
    renderNav();
    const canManageUsers = ["ADMIN", "DUENIO"].includes(user.role);
    if (canManageUsers) {
      document.getElementById("tab-usuarios").style.display = "inline-block";
      document.getElementById("tab-permisos").style.display = "inline-block";
      document.getElementById("tab-parametros").style.display = "inline-block";
      document.getElementById("tab-plantillas").style.display = "inline-block";
      document.getElementById("tab-auditoria").style.display = "inline-block";
    }

    let categories = [], stations = [], modifierGroups = [], products = [], rooms = [], users = [];
    let ingredients = [], permissionGroups = [], settings = null, auditLogs = [], invoiceTemplates = [];

    async function loadAll() {
      const [c, s, mg, p, r] = await Promise.all([
        api("/menu/categories"),
        api("/menu/stations"),
        api("/menu/modifier-groups"),
        api("/menu/products"),
        api("/rooms"),
      ]);
      categories = c.categories; stations = s.stations; modifierGroups = mg.modifierGroups;
      products = p.products; rooms = r.rooms;
      if (canManageUsers) {
        const u = await api("/auth/users");
        users = u.users;
      }
      try {
        const inv = await api("/inventory/ingredients");
        ingredients = inv.ingredients;
      } catch (err) { ingredients = []; }
      if (canManageUsers) {
        try {
          const perms = await api("/permissions");
          permissionGroups = perms.groups;
        } catch (err) { permissionGroups = []; }
        try {
          const s2 = await api("/settings");
          settings = s2.settings;
        } catch (err) { settings = null; }
        try {
          const a = await api("/audit?limit=150");
          auditLogs = a.logs;
        } catch (err) { auditLogs = []; }
        try {
          const t = await api("/invoice-templates");
          invoiceTemplates = t.templates;
        } catch (err) { invoiceTemplates = []; }
      }
    }

    // ---------------------------------------------------------------------
    // Categorías
    // ---------------------------------------------------------------------
    function renderCategorias() {
      return `
        <div class="card mb16">
          <div class="flex-between mb8"><h3 style="margin:0">Categorías del menú</h3><button class="btn btn-primary btn-sm" id="add-cat">+ Nueva categoría</button></div>
          <table><thead><tr><th>Nombre</th><th>Orden</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            ${categories.map(c => `<tr>
              <td>${c.name}</td><td>${c.order}</td>
              <td><span class="pill pill-${c.active ? "libre" : "pendiente_pago"}">${c.active ? "Activa" : "Inactiva"}</span></td>
              <td><button class="btn btn-sm" data-toggle-cat="${c.id}" data-active="${c.active}">${c.active ? "Desactivar" : "Activar"}</button></td>
            </tr>`).join("")}
          </tbody></table>
        </div>`;
    }
    function wireCategorias() {
      document.getElementById("add-cat").addEventListener("click", () => {
        const overlay = showModal(`<h2>Nueva categoría</h2>
          <div class="field"><label>Nombre</label><input id="cat-name" /></div>
          <div class="field"><label>Orden</label><input id="cat-order" type="number" value="0" /></div>
          <button class="btn btn-primary" id="save-cat">Guardar</button>`);
        overlay.querySelector("#save-cat").addEventListener("click", async () => {
          try {
            await apiWithOverride("/menu/categories", { method: "POST", body: { name: overlay.querySelector("#cat-name").value, order: Number(overlay.querySelector("#cat-order").value) } }, "menu:manage");
            closeModal(overlay); await refresh();
          } catch (err) { toast(err.message, "error"); }
        });
      });
      document.querySelectorAll("[data-toggle-cat]").forEach(btn => btn.addEventListener("click", async () => {
        try {
          await apiWithOverride(`/menu/categories/${btn.dataset.toggleCat}`, { method: "PATCH", body: { active: btn.dataset.active !== "true" } }, "menu:manage");
          await refresh();
        } catch (err) { toast(err.message, "error"); }
      }));
    }

    // ---------------------------------------------------------------------
    // Estaciones
    // ---------------------------------------------------------------------
    function renderEstaciones() {
      return `
        <div class="card mb16">
          <div class="flex-between mb8"><h3 style="margin:0">Estaciones de preparación</h3><button class="btn btn-primary btn-sm" id="add-station">+ Nueva estación</button></div>
          <p class="small muted">Ej: Cocina, Barra, Cafetería, Postres. Cada producto se asigna a una estación para que la comanda llegue al sector correcto.</p>
          <table><thead><tr><th>Nombre</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            ${stations.map(s => `<tr><td>${s.name}</td>
              <td><span class="pill pill-${s.active ? "libre" : "pendiente_pago"}">${s.active ? "Activa" : "Inactiva"}</span></td>
              <td><button class="btn btn-sm" data-toggle-station="${s.id}" data-active="${s.active}">${s.active ? "Desactivar" : "Activar"}</button></td>
            </tr>`).join("")}
          </tbody></table>
        </div>`;
    }
    function wireEstaciones() {
      document.getElementById("add-station").addEventListener("click", () => {
        const overlay = showModal(`<h2>Nueva estación</h2><div class="field"><label>Nombre</label><input id="station-name" /></div><button class="btn btn-primary" id="save-station">Guardar</button>`);
        overlay.querySelector("#save-station").addEventListener("click", async () => {
          try {
            await apiWithOverride("/menu/stations", { method: "POST", body: { name: overlay.querySelector("#station-name").value } }, "menu:manage");
            closeModal(overlay); await refresh();
          } catch (err) { toast(err.message, "error"); }
        });
      });
      document.querySelectorAll("[data-toggle-station]").forEach(btn => btn.addEventListener("click", async () => {
        try {
          await apiWithOverride(`/menu/stations/${btn.dataset.toggleStation}`, { method: "PATCH", body: { active: btn.dataset.active !== "true" } }, "menu:manage");
          await refresh();
        } catch (err) { toast(err.message, "error"); }
      }));
    }

    // ---------------------------------------------------------------------
    // Adicionales / modificadores
    // ---------------------------------------------------------------------
    function renderAdicionales() {
      return `
        <div class="card mb16">
          <div class="flex-between mb8"><h3 style="margin:0">Grupos de adicionales / modificadores</h3><button class="btn btn-primary btn-sm" id="add-modgroup">+ Nuevo grupo</button></div>
          <p class="small muted">Ej: "Punto de la carne" (obligatorio, elegir 1) o "Adicionales" (opcional, elegir varios).</p>
          ${modifierGroups.map(g => `
            <div class="card mb8" style="background:var(--surface-alt)">
              <strong>${g.name}</strong> <span class="small muted">(min ${g.min} / max ${g.max}${g.required ? " · obligatorio" : ""}${g.split_mode ? " · reparto de cantidades" : ""})</span>
              <ul class="small">${g.modifiers.map(m => `<li>${m.name} ${Number(m.price) > 0 ? "+$" + money(m.price) : ""}</li>`).join("")}</ul>
              <button class="btn btn-sm" data-add-modifier="${g.id}">+ agregar opción</button>
            </div>`).join("")}
        </div>`;
    }
    function wireAdicionales() {
      document.getElementById("add-modgroup").addEventListener("click", () => {
        const overlay = showModal(`<h2>Nuevo grupo de adicionales</h2>
          <div class="field"><label>Nombre</label><input id="mg-name" /></div>
          <div class="grid grid-2">
            <div class="field"><label>Mínimo</label><input id="mg-min" type="number" value="0" /></div>
            <div class="field"><label>Máximo</label><input id="mg-max" type="number" value="1" /></div>
          </div>
          <div class="field"><label><input type="checkbox" id="mg-required" style="width:auto" /> Obligatorio</label></div>
          <div class="field"><label><input type="checkbox" id="mg-split" style="width:auto" /> Grupo de reparto de cantidades (ej: sabores de empanadas: la cantidad total del ítem se reparte entre estas opciones, en vez de tildarlas)</label></div>
          <div class="field"><label>Opciones (una por línea, formato: Nombre,precio)</label><textarea id="mg-options" rows="3" placeholder="Extra queso,500\nSin cebolla,0"></textarea></div>
          <button class="btn btn-primary" id="save-mg">Guardar</button>`);
        overlay.querySelector("#save-mg").addEventListener("click", async () => {
          const lines = overlay.querySelector("#mg-options").value.split("\n").map(l => l.trim()).filter(Boolean);
          const modifiers = lines.map(l => { const [name, price] = l.split(","); return { name: (name || "").trim(), price: Number(price || 0) }; });
          try {
            await apiWithOverride("/menu/modifier-groups", { method: "POST", body: {
              name: overlay.querySelector("#mg-name").value,
              splitMode: overlay.querySelector("#mg-split").checked,
              min: Number(overlay.querySelector("#mg-min").value),
              max: Number(overlay.querySelector("#mg-max").value),
              required: overlay.querySelector("#mg-required").checked,
              modifiers,
            }}, "menu:manage");
            closeModal(overlay); await refresh();
          } catch (err) { toast(err.message, "error"); }
        });
      });
      document.querySelectorAll("[data-add-modifier]").forEach(btn => btn.addEventListener("click", () => {
        const overlay = showModal(`<h2>Nueva opción</h2>
          <div class="field"><label>Nombre</label><input id="mod-name" /></div>
          <div class="field"><label>Precio adicional</label><input id="mod-price" type="number" value="0" /></div>
          <button class="btn btn-primary" id="save-mod">Guardar</button>`);
        overlay.querySelector("#save-mod").addEventListener("click", async () => {
          try {
            await apiWithOverride(`/menu/modifier-groups/${btn.dataset.addModifier}/modifiers`, { method: "POST", body: {
              name: overlay.querySelector("#mod-name").value, price: Number(overlay.querySelector("#mod-price").value)
            }}, "menu:manage");
            closeModal(overlay); await refresh();
          } catch (err) { toast(err.message, "error"); }
        });
      }));
    }

    // ---------------------------------------------------------------------
    // Productos
    // ---------------------------------------------------------------------
    function renderProductos() {
      return `
        <div class="card mb16">
          <div class="flex-between mb8"><h3 style="margin:0">Productos</h3><div class="flex-gap"><a class="btn btn-sm" href="/pages/importar.html">⬆ Importar desde Excel/Fudo</a><button class="btn btn-primary btn-sm" id="add-product">+ Nuevo producto</button></div></div>
          <table><thead><tr><th>Nombre</th><th>Categoría</th><th>Estación</th><th>Precio base</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            ${products.map(p => `<tr>
              <td>${p.name}</td><td>${p.category_name || '<span class="muted small">(sin categoría — no aparece en la carta)</span>'}</td><td>${p.station_name || "-"}</td><td>$${money(p.base_price)}</td>
              <td><span class="pill pill-${p.active ? "libre" : "pendiente_pago"}">${p.active ? "Activo" : "Inactivo"}</span></td>
              <td class="flex-gap">
                <button class="btn btn-sm" data-edit-product="${p.id}">Editar</button>
                <button class="btn btn-sm" data-toggle-product="${p.id}" data-active="${p.active}">${p.active ? "Desactivar" : "Activar"}</button>
                <button class="btn btn-sm" data-edit-recipe="${p.id}" data-name="${p.name}">Receta</button>
              </td>
            </tr>`).join("")}
          </tbody></table>
        </div>`;
    }
    function wireProductos() {
      document.getElementById("add-product").addEventListener("click", () => {
        const overlay = showModal(`<h2>Nuevo producto</h2>
          <div class="field"><label>Nombre</label><input id="prod-name" /></div>
          <div class="field"><label>Descripción</label><input id="prod-desc" /></div>
          <div class="grid grid-2">
            <div class="field"><label>Categoría</label><select id="prod-cat"><option value="">(sin categoría — no aparece en la carta)</option>${categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("")}</select></div>
            <div class="field"><label>Estación</label><select id="prod-station"><option value="">(ninguna)</option>${stations.map(s => `<option value="${s.id}">${s.name}</option>`).join("")}</select></div>
          </div>
          <div class="field"><label>Precio base</label><input id="prod-price" type="number" step="0.01" /></div>
          <div class="field"><label>Variantes (opcional, una por línea: Nombre,precio)</label><textarea id="prod-variants" rows="2" placeholder="Chica,5500\nGrande,8500"></textarea></div>
          <div class="field"><label>Grupos de adicionales</label>
            ${modifierGroups.map(g => `<label class="small" style="display:block;font-weight:normal"><input type="checkbox" value="${g.id}" class="prod-mg" style="width:auto" /> ${g.name}</label>`).join("") || '<span class="small muted">No hay grupos creados todavía.</span>'}
          </div>
          <button class="btn btn-primary" id="save-product">Guardar</button>`);
        overlay.querySelector("#save-product").addEventListener("click", async () => {
          const lines = overlay.querySelector("#prod-variants").value.split("\n").map(l => l.trim()).filter(Boolean);
          const variants = lines.map(l => { const [name, price] = l.split(","); return { name: (name || "").trim(), price: Number(price || 0) }; });
          const modifierGroupIds = Array.from(overlay.querySelectorAll(".prod-mg:checked")).map(i => i.value);
          try {
            await apiWithOverride("/menu/products", { method: "POST", body: {
              name: overlay.querySelector("#prod-name").value,
              description: overlay.querySelector("#prod-desc").value || null,
              categoryId: overlay.querySelector("#prod-cat").value || null,
              stationId: overlay.querySelector("#prod-station").value || null,
              basePrice: Number(overlay.querySelector("#prod-price").value),
              variants, modifierGroupIds,
            }}, "menu:manage");
            closeModal(overlay); await refresh();
          } catch (err) { toast(err.message, "error"); }
        });
      });
      document.querySelectorAll("[data-toggle-product]").forEach(btn => btn.addEventListener("click", async () => {
        const active = btn.dataset.active !== "true";
        try {
          await apiWithOverride(`/menu/products/${btn.dataset.toggleProduct}`, { method: "PATCH", body: { active } }, "menu:manage");
          await refresh();
        } catch (err) { toast(err.message, "error"); }
      }));
      document.querySelectorAll("[data-edit-recipe]").forEach(btn => btn.addEventListener("click", () => openRecipeEditor(btn.dataset.editRecipe, btn.dataset.name)));
      document.querySelectorAll("[data-edit-product]").forEach(btn => btn.addEventListener("click", () => openEditProduct(btn.dataset.editProduct)));
    }

    // Edita un producto existente (nombre/descripción/categoría/estación/
    // precio/imagen/compuesto) sin tener que borrarlo y volver a crearlo.
    function openEditProduct(productId) {
      const p = products.find(pr => pr.id === productId);
      if (!p) return;
      const overlay = showModal(`<h2>Editar producto</h2>
        <div class="field"><label>Nombre</label><input id="ep-name" value="${(p.name || "").replace(/"/g, "&quot;")}" /></div>
        <div class="field"><label>Descripción</label><input id="ep-desc" value="${(p.description || "").replace(/"/g, "&quot;")}" /></div>
        <div class="grid grid-2">
          <div class="field"><label>Categoría</label><select id="ep-cat"><option value="" ${!p.category_id ? "selected" : ""}>(sin categoría — no aparece en la carta)</option>${categories.map(c => `<option value="${c.id}" ${c.id === p.category_id ? "selected" : ""}>${c.name}</option>`).join("")}</select></div>
          <div class="field"><label>Estación</label><select id="ep-station"><option value="">(ninguna)</option>${stations.map(s => `<option value="${s.id}" ${s.id === p.station_id ? "selected" : ""}>${s.name}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label>Precio base</label><input id="ep-price" type="number" step="0.01" value="${p.base_price}" /></div>
        <div class="field"><label>URL de imagen (opcional)</label><input id="ep-image" value="${p.image_url || ""}" /></div>
        <div class="field"><label><input type="checkbox" id="ep-composite" style="width:auto" ${p.is_composite ? "checked" : ""} /> Producto compuesto (ver Grupos de opciones)</label></div>
        <button class="btn btn-primary" id="save-edit-product">Guardar cambios</button>`);
      overlay.querySelector("#save-edit-product").addEventListener("click", async () => {
        try {
          await apiWithOverride(`/menu/products/${productId}`, { method: "PATCH", body: {
            name: overlay.querySelector("#ep-name").value,
            description: overlay.querySelector("#ep-desc").value || null,
            categoryId: overlay.querySelector("#ep-cat").value || null,
            stationId: overlay.querySelector("#ep-station").value || null,
            basePrice: Number(overlay.querySelector("#ep-price").value),
            imageUrl: overlay.querySelector("#ep-image").value || null,
            isComposite: overlay.querySelector("#ep-composite").checked,
          }}, "menu:manage");
          closeModal(overlay);
          await refresh();
          toast("Producto actualizado.", "success");
        } catch (err) { toast(err.message, "error"); }
      });
    }

    // Receta de un producto: qué insumos del inventario consume y en qué
    // cantidad, para poder descontar el stock automáticamente al vender.
    async function openRecipeEditor(productId, productName) {
      if (ingredients.length === 0) {
        const overlay = showModal(`<h2>Receta de ${productName}</h2>
          <p class="muted small">Todavía no cargaste insumos en Inventario. Andá a la pestaña "Inventario" para crear alguno primero.</p>`);
        return;
      }
      let recipe = [];
      try {
        const data = await api(`/inventory/recipes/${productId}`);
        recipe = data.recipe;
      } catch (err) { /* sin receta todavía */ }

      const rowHtml = (ingredientId, quantity) => `
        <div class="flex-gap mb8 recipe-row">
          <select class="recipe-ingredient" style="flex:2">
            ${ingredients.map(i => `<option value="${i.id}" ${i.id === ingredientId ? "selected" : ""}>${i.name} (${i.unit})</option>`).join("")}
          </select>
          <input type="number" step="0.001" class="recipe-qty" value="${quantity ?? 1}" style="flex:1" />
          <button class="btn btn-sm btn-danger" data-remove-row type="button">×</button>
        </div>`;

      const overlay = showModal(`<h2>Receta de ${productName}</h2>
        <p class="small muted">Cantidad de cada insumo que se consume por cada unidad vendida de este producto.</p>
        <div id="recipe-rows">${recipe.map(r => rowHtml(r.ingredient_id, r.quantity)).join("") || rowHtml(ingredients[0].id, 1)}</div>
        <button class="btn btn-sm" id="add-recipe-row" type="button">+ Agregar insumo</button>
        <div class="mt16"><button class="btn btn-primary" id="save-recipe">Guardar receta</button></div>`);

      function wireRemove() {
        overlay.querySelectorAll("[data-remove-row]").forEach(b => b.addEventListener("click", () => b.closest(".recipe-row").remove()));
      }
      wireRemove();
      overlay.querySelector("#add-recipe-row").addEventListener("click", () => {
        overlay.querySelector("#recipe-rows").insertAdjacentHTML("beforeend", rowHtml(ingredients[0].id, 1));
        wireRemove();
      });
      overlay.querySelector("#save-recipe").addEventListener("click", async () => {
        const items = Array.from(overlay.querySelectorAll(".recipe-row")).map(row => ({
          ingredientId: row.querySelector(".recipe-ingredient").value,
          quantity: Number(row.querySelector(".recipe-qty").value),
        })).filter(i => i.quantity > 0);
        try {
          await apiWithOverride(`/inventory/recipes/${productId}`, { method: "PUT", body: { items } }, "inventory:manage");
          closeModal(overlay);
          toast("Receta guardada.", "success");
        } catch (err) { toast(err.message, "error"); }
      });
    }

    // ---------------------------------------------------------------------
    // Salón y mesas
    // ---------------------------------------------------------------------
    let selectedTables = new Set();
    function renderSalon() {
      selectedTables = new Set();
      return `
        <div class="flex-between mb8"><h3 style="margin:0">Salones</h3><button class="btn btn-primary btn-sm" id="add-room">+ Nuevo salón</button></div>
        <p class="small muted">Arrastrá las mesas para acomodarlas, arrastrá la esquina inferior derecha para cambiar el tamaño. Ctrl/Cmd+click (o Shift+click) para seleccionar varias mesas a la vez.</p>
        <div class="bulk-toolbar" id="bulk-toolbar" style="display:none">
          <span id="bulk-count"></span>
          <button class="btn btn-sm btn-danger" id="bulk-delete-btn">Eliminar seleccionadas</button>
          <button class="btn btn-sm" id="bulk-clear-btn">Cancelar selección</button>
        </div>
        ${rooms.map(r => `
          <div class="card mb16">
            <div class="flex-between mb8">
              <strong>${r.name}</strong>
              <div class="flex-gap">
                <button class="btn btn-sm" data-rename-room="${r.id}" data-name="${r.name}">Renombrar</button>
                <button class="btn btn-sm btn-danger" data-delete-room="${r.id}">Eliminar salón</button>
                <button class="btn btn-sm btn-primary" data-add-table="${r.id}">+ Agregar mesa</button>
              </div>
            </div>
            <div class="salon-editor" data-room-canvas="${r.id}">
              ${r.tables.length === 0 ? `<div class="empty-state">Sin mesas todavía.</div>` : r.tables.map(t => `
                <div class="table-tile editable-table ${t.shape === "CIRCLE" ? "shape-circle" : ""}" style="left:${t.pos_x}px; top:${t.pos_y}px; width:${t.width}px; height:${t.height}px" data-table="${t.id}" data-pos-x="${t.pos_x}" data-pos-y="${t.pos_y}" data-width="${t.width}" data-height="${t.height}">
                  <div class="t-name" data-rename-table="${t.id}" title="Click para renombrar">${t.name}</div>
                  <div class="t-cap">${t.capacity} pers.</div>
                  <button class="table-tile-delete" data-delete-table="${t.id}" title="Eliminar mesa">×</button>
                  <div class="table-tile-resize" title="Arrastrar para cambiar el tamaño"></div>
                </div>`).join("")}
            </div>

    // Renombrar una mesa fácilmente: click en el nombre y se convierte en un
    // campo editable ahí mismo (sin abrir un formulario aparte).
    function wireTableRenaming() {
      document.querySelectorAll("[data-rename-table]").forEach((nameEl) => {
        nameEl.addEventListener("click", (e) => {
          e.stopPropagation();
          if (nameEl.querySelector("input")) return; // ya está en edición
          const tableId = nameEl.dataset.renameTable;
          const originalName = nameEl.textContent;
          nameEl.innerHTML = `<input type="text" class="table-rename-input" value="${originalName.replace(/"/g, "&quot;")}" />`;
          const input = nameEl.querySelector("input");
          input.focus();
          input.select();
          let done = false;
          async function commit() {
            if (done) return;
            done = true;
            const newName = input.value.trim();
            if (!newName || newName === originalName) {
              nameEl.textContent = originalName;
              return;
            }
            try {
              await apiWithOverride(`/tables/${tableId}`, { method: "PATCH", body: { name: newName } }, "tables:manage");
              toast("Mesa renombrada.", "success");
              await refresh();
            } catch (err) {
              toast(err.message, "error");
              input.classList.add("input-error");
              nameEl.textContent = originalName;
            }
          }
          input.addEventListener("keydown", (ev) => {
            ev.stopPropagation();
            if (ev.key === "Enter") { ev.preventDefault(); commit(); }
            if (ev.key === "Escape") { done = true; nameEl.textContent = originalName; }
          });
          input.addEventListener("blur", commit);
          input.addEventListener("pointerdown", (ev) => ev.stopPropagation());
        });
      });
    }

    // Selección múltiple de mesas (como archivos en una compu): Ctrl/Cmd+click
    // o Shift+click agrega/quita una mesa de la selección en vez de abrirla,
    // para poder aplicarles una acción en grupo (por ahora, borrado).
    function wireTableSelection() {
      document.querySelectorAll(".editable-table").forEach((tile) => {
        tile.addEventListener("click", (e) => {
          if (e.target.closest(".table-tile-delete") || e.target.closest(".table-rename-input")) return;
          if (!(e.ctrlKey || e.metaKey || e.shiftKey)) return;
          e.preventDefault();
          e.stopPropagation();
          const id = tile.dataset.table;
          if (selectedTables.has(id)) selectedTables.delete(id);
          else selectedTables.add(id);
          updateBulkToolbar();
        });
      });
      updateBulkToolbar();
    }

    // Arrastre de mesas con el mouse/touch (pointer events cubre ambos) en
    // vez de tener que tipear la posición en píxeles a mano.
    function wireTableDragging() {
      document.querySelectorAll(".editable-table").forEach((tile) => {
        let dragging = false;
        let startX, startY, origLeft, origTop;

        tile.addEventListener("pointerdown", (e) => {
          if (e.target.closest(".table-tile-delete") || e.target.closest(".table-tile-resize") || e.target.closest(".t-name")) return;
          if (e.ctrlKey || e.metaKey || e.shiftKey) return; // esas combinaciones son para seleccionar, no mover
          dragging = true;
          tile.setPointerCapture(e.pointerId);
          tile.classList.add("dragging");
          startX = e.clientX;
          startY = e.clientY;
          origLeft = Number(tile.dataset.posX);
          origTop = Number(tile.dataset.posY);
        });

        tile.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const canvas = tile.closest(".salon-editor");
          const newLeft = Math.max(0, Math.min(origLeft + (e.clientX - startX), canvas.clientWidth - tile.offsetWidth));
          const newTop = Math.max(0, Math.min(origTop + (e.clientY - startY), canvas.clientHeight - tile.offsetHeight));
          tile.style.left = `${newLeft}px`;
          tile.style.top = `${newTop}px`;
          tile.dataset.pendingX = Math.round(newLeft);
          tile.dataset.pendingY = Math.round(newTop);
        });

        async function endDrag(e) {
          if (!dragging) return;
          dragging = false;
          tile.classList.remove("dragging");
          const posX = tile.dataset.pendingX ? Number(tile.dataset.pendingX) : origLeft;
          const posY = tile.dataset.pendingY ? Number(tile.dataset.pendingY) : origTop;
          tile.dataset.posX = posX;
          tile.dataset.posY = posY;
          delete tile.dataset.pendingX;
          delete tile.dataset.pendingY;
          try {
            await apiWithOverride(`/tables/${tile.dataset.table}`, { method: "PATCH", body: { posX, posY } }, "tables:manage");
          } catch (err) {
            toast(err.message, "error");
          }
        }
        tile.addEventListener("pointerup", endDrag);
        tile.addEventListener("pointercancel", endDrag);
      });
    }

    // Redimensionar una mesa arrastrando el tirador de la esquina inferior
    // derecha, para poder ajustar su forma/tamaño de manera intuitiva en vez
    // de tener siempre el mismo tamaño fijo.
    function wireTableResizing() {
      document.querySelectorAll(".table-tile-resize").forEach((handle) => {
        const tile = handle.closest(".editable-table");
        let resizing = false;
        let startX, startY, origWidth, origHeight;

        handle.addEventListener("pointerdown", (e) => {
          e.stopPropagation();
          resizing = true;
          handle.setPointerCapture(e.pointerId);
          startX = e.clientX;
          startY = e.clientY;
          origWidth = Number(tile.dataset.width);
          origHeight = Number(tile.dataset.height);
        });

        handle.addEventListener("pointermove", (e) => {
          if (!resizing) return;
          e.stopPropagation();
          let newWidth = Math.max(50, Math.min(280, origWidth + (e.clientX - startX)));
          let newHeight = Math.max(50, Math.min(280, origHeight + (e.clientY - startY)));
          if (tile.classList.contains("shape-circle")) {
            // Para que el círculo se vea siempre redondo (no ovalado).
            newHeight = newWidth;
          }
          tile.style.width = `${newWidth}px`;
          tile.style.height = `${newHeight}px`;
          tile.dataset.pendingWidth = Math.round(newWidth);
          tile.dataset.pendingHeight = Math.round(newHeight);
        });

        async function endResize(e) {
          if (!resizing) return;
          resizing = false;
          const width = tile.dataset.pendingWidth ? Number(tile.dataset.pendingWidth) : origWidth;
          const height = tile.dataset.pendingHeight ? Number(tile.dataset.pendingHeight) : origHeight;
          tile.dataset.width = width;
          tile.dataset.height = height;
          delete tile.dataset.pendingWidth;
          delete tile.dataset.pendingHeight;
          try {
            await apiWithOverride(`/tables/${tile.dataset.table}`, { method: "PATCH", body: { width, height } }, "tables:manage");
          } catch (err) {
            toast(err.message, "error");
          }
        }
        handle.addEventListener("pointerup", endResize);
        handle.addEventListener("pointercancel", endResize);
      });
    }

            <label>Modo</label>
            <select id="set-tax-mode">
              <option value="NONE" ${(s.tax_mode || "NONE") === "NONE" ? "selected" : ""}>No aplicar</option>
              <option value="INCLUSIVE" ${s.tax_mode === "INCLUSIVE" ? "selected" : ""}>Incluido en el precio (solo se discrimina en la factura)</option>
              <option value="ADDITIVE" ${s.tax_mode === "ADDITIVE" ? "selected" : ""}>Se suma aparte (el cliente paga precio + impuesto)</option>
            </select>
          </div>
          <button class="btn btn-primary" id="save-settings-tax">Guardar configuración de impuesto</button>
        </div>
        <div class="card mb16">
          <h3 style="margin-top:0">Envío de facturas por mail</h3>
          <p class="small muted">Opcional. Completá esto si querés poder mandar la factura por mail directamente desde un pedido, además de descargarla en PDF. Si no lo configurás, siempre podés descargar el PDF igual.</p>
          <p class="small" style="background:#fff8e1;padding:8px;border-radius:6px">
            <strong>Importante si la app está alojada en el plan gratuito de Render:</strong> desde septiembre de 2025 ese plan bloquea las conexiones salientes por SMTP (puertos 25/465/587), así que la configuración de SMTP de abajo no va a funcionar ahí. Para ese caso usá la <strong>API key de Resend</strong> (es gratis para empezar, funciona por HTTPS y no choca con ese bloqueo): creá una cuenta en resend.com, generá una API key y pegala acá.
          </p>
          <div class="field"><label>API key de Resend ${s.resend_api_key_set ? "(ya configurada, dejá en blanco para no cambiarla)" : ""}</label><input id="set-resend-key" type="password" placeholder="re_xxxxxxxx" /></div>
          <div class="field"><label>Email remitente</label><input id="set-smtp-from" value="${s.smtp_from || ""}" placeholder="facturas@turestaurante.com" /></div>
          <button class="btn btn-primary" id="save-settings-2">Guardar email remitente / Resend</button>
          <hr style="margin:16px 0;border-color:var(--border)" />
          <p class="small muted">Alternativa: SMTP tradicional (solo funciona si la app NO está en el plan gratuito de Render, o si se pasó a un plan pago).</p>
          <div class="grid grid-2">
            <div class="field"><label>Host SMTP</label><input id="set-smtp-host" value="${s.smtp_host || ""}" placeholder="smtp.gmail.com" /></div>
            <div class="field"><label>Puerto</label><input id="set-smtp-port" type="number" value="${s.smtp_port || 587}" /></div>
          </div>
          <div class="field"><label>Usuario SMTP</label><input id="set-smtp-user" value="${s.smtp_user || ""}" /></div>
          <div class="field"><label>Contraseña SMTP ${s.smtp_pass_set ? "(ya configurada, dejá en blanco para no cambiarla)" : ""}</label><input id="set-smtp-pass" type="password" /></div>
          <button class="btn" id="save-settings-smtp">Guardar configuración de SMTP</button>
        </div>
        <div class="card mb16">
          <h3 style="margin-top:0">Idioma</h3>
          <p class="small muted">Cambia el idioma de toda la interfaz para todo el personal (navegación, títulos y acciones principales). Los nombres de productos, categorías y mesas que vos cargaste, y los mensajes que devuelve el sistema, se mantienen en español.</p>
          <div class="field">
            <label>Idioma de la interfaz</label>
            <select id="set-language">
              <option value="es" ${(s.language || "es") === "es" ? "selected" : ""}>Español</option>
              <option value="fr" ${s.language === "fr" ? "selected" : ""}>Français</option>
              <option value="en" ${s.language === "en" ? "selected" : ""}>English</option>
              <option value="pt" ${s.language === "pt" ? "selected" : ""}>Português</option>
              <option value="it" ${s.language === "it" ? "selected" : ""}>Italiano</option>
            </select>
          </div>
          <button class="btn btn-primary" id="save-settings-language">Guardar idioma</button>
        </div>`;
    }
    function wireParametros() {
      async function saveBusinessData() {
        try {
          await apiWithOverride("/settings", { method: "PATCH", body: {
            name: document.getElementById("set-name").value,
            legalName: document.getElementById("set-legal-name").value,
            taxId: document.getElementById("set-tax-id").value,
            currency: document.getElementById("set-currency").value,
            fiscalAddress: document.getElementById("set-fiscal-address").value,
            phone: document.getElementById("set-phone").value,
            invoicePrefix: document.getElementById("set-invoice-prefix").value,
          }}, "settings:manage");
          toast("Datos del negocio guardados.", "success");
          await refresh();
        } catch (err) { toast(err.message, "error"); }
      }
      async function saveMailData() {
        try {
          await apiWithOverride("/settings", { method: "PATCH", body: {
            resendApiKey: document.getElementById("set-resend-key").value || undefined,
            smtpFrom: document.getElementById("set-smtp-from").value || null,
          }}, "settings:manage");
          toast("Configuración de mail guardada.", "success");
          await refresh();
        } catch (err) { toast(err.message, "error"); }
      }
      async function saveSmtpData() {
        try {
          await apiWithOverride("/settings", { method: "PATCH", body: {
            smtpHost: document.getElementById("set-smtp-host").value || null,
            smtpPort: Number(document.getElementById("set-smtp-port").value) || null,
            smtpUser: document.getElementById("set-smtp-user").value || null,
            smtpPass: document.getElementById("set-smtp-pass").value || undefined,
          }}, "settings:manage");
          toast("Configuración de SMTP guardada.", "success");
          await refresh();
        } catch (err) { toast(err.message, "error"); }
      }
      async function saveTaxData() {
        try {
          await apiWithOverride("/settings", { method: "PATCH", body: {
            taxLabel: document.getElementById("set-tax-label").value || "IVA",
            taxRate: Number(document.getElementById("set-tax-rate").value) || 0,
            taxMode: document.getElementById("set-tax-mode").value,
          }}, "settings:manage");
          toast("Configuración de impuesto guardada.", "success");
          await refresh();
        } catch (err) { toast(err.message, "error"); }
      }
      async function saveLanguage() {
        try {
          const language = document.getElementById("set-language").value;
          await apiWithOverride("/settings", { method: "PATCH", body: { language } }, "settings:manage");
          setLang(language); // cachea el idioma nuevo para que la recarga ya no tenga que ir a buscarlo
          location.hash = "parametros"; // al recargar, volver a esta misma pestaña
          toast("Idioma actualizado.", "success");
          // Recargamos toda la página: además de los textos con data-i18n, hay
          // contenido armado en JS al cargar (la barra de navegación, la
          // etiqueta del rol, las pestañas ya abiertas) que no se vuelve a
          // generar solo. Recargar es la forma más simple de garantizar que
          // *todo* quede en el idioma nuevo de una, sin tener que cazar cada
          // rincón de la interfaz a mano.
          setTimeout(() => location.reload(), 600);
        } catch (err) { toast(err.message, "error"); }
      }
      document.getElementById("save-settings-1").addEventListener("click", saveBusinessData);
      document.getElementById("save-settings-tax").addEventListener("click", saveTaxData);
      document.getElementById("save-settings-2").addEventListener("click", saveMailData);
      document.getElementById("save-settings-smtp").addEventListener("click", saveSmtpData);
      document.getElementById("save-settings-language").addEventListener("click", saveLanguage);
    }

    // ---------------------------------------------------------------------
    // Reportes
    // ---------------------------------------------------------------------
    function renderReportes() {
      const today = new Date().toISOString().slice(0, 10);
      const monthAgo = new Date(Date.now() - 30 * 24 * 3600 * 1000).toISOString().slice(0, 10);
      return `
        <div class="card mb16">
          <h3 style="margin-top:0">Cuenta de resultados</h3>
          <p class="small muted">Descarga un Excel con ventas totales, costo de mercadería vendida (según las recetas cargadas en Inventario), ganancia bruta, ventas por producto y pagos por medio, para el rango de fechas elegido.</p>
          <div class="grid grid-2">
            <div class="field"><label>Desde</label><input type="date" id="rep-from" value="${monthAgo}" /></div>
            <div class="field"><label>Hasta</label><input type="date" id="rep-to" value="${today}" /></div>
          </div>
          <button class="btn btn-primary" id="download-report">Descargar Excel</button>
        </div>`;
    }
    function wireReportes() {
      document.getElementById("download-report").addEventListener("click", async () => {
        const from = document.getElementById("rep-from").value;
        const to = document.getElementById("rep-to").value;
        try {
          const res = await fetch(`/api/reports/income-statement?from=${from}&to=${to}`, {
            headers: { Authorization: `Bearer ${getToken()}` },
          });
          if (!res.ok) {
            const data = await res.json().catch(() => null);
            throw new Error((data && data.error) || "No se pudo generar el reporte.");
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = "cuenta-de-resultados.xlsx";
          document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(url);
        } catch (err) { toast(err.message, "error"); }
      });
    }

    // ---------------------------------------------------------------------
    // Auditoría
    // ---------------------------------------------------------------------
    function renderAuditoria() {
      return `
        <div class="card mb16">
          <h3 style="margin-top:0">Registro de auditoría</h3>
          <p class="small muted">Últimas ${auditLogs.length} acciones registradas (las más nuevas primero).</p>
          <table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th></tr></thead>
          <tbody>
            ${auditLogs.map(l => `<tr>
              <td class="small">${new Date(l.created_at).toLocaleString("es-AR")}</td>
              <td class="small">${l.user_name || "-"}</td>
              <td class="small">${l.action}</td>
              <td class="small">${l.entity}${l.entity_id ? " · " + String(l.entity_id).slice(0, 8) : ""}</td>
            </tr>`).join("") || `<tr><td colspan="4" class="muted small">Sin registros todavía.</td></tr>`}
          </tbody></table>
        </div>`;
    }
    function wireAuditoria() {}

    // ---------------------------------------------------------------------
    // Plantillas de factura (editor básico: logo, textos, color, preset)
    // ---------------------------------------------------------------------
    const TEMPLATE_LAYOUTS = { CLASICO: "Clásico", MODERNO: "Moderno", MINIMAL: "Minimalista" };
    function renderPlantillas() {
      return `
        <div class="card mb16">
          <div class="flex-between mb8"><h3 style="margin:0">Plantillas de factura</h3><button class="btn btn-primary btn-sm" id="add-template">+ Nueva plantilla</button></div>
          <p class="small muted">Editor básico para personalizar el diseño de las facturas: logo, textos de encabezado/pie, color y un preset de estilo. Podés tener varios modelos y elegir cuál usar (o marcar uno como predeterminado) al emitir una factura.</p>
          ${invoiceTemplates.length === 0 ? `<p class="small muted">Todavía no creaste ninguna plantilla: se usa el diseño de fábrica al facturar.</p>` : ""}
          <div class="grid grid-2">
            ${invoiceTemplates.map(t => `
              <div class="card mb8" style="background:var(--surface-alt)">
                <div class="flex-between">
                  <strong>${t.name} ${t.is_default ? '<span class="pill pill-libre">Predeterminada</span>' : ""}</strong>
                  <span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:${t.accent_color}"></span>
                </div>
                <p class="small muted">Estilo: ${TEMPLATE_LAYOUTS[t.layout] || t.layout} ${t.has_logo ? "· con logo" : "· sin logo"}</p>
                <div class="flex-gap">
                  <button class="btn btn-sm" data-edit-template="${t.id}">Editar</button>
                  ${!t.is_default ? `<button class="btn btn-sm" data-default-template="${t.id}">Usar como predeterminada</button>` : ""}
                  <button class="btn btn-sm btn-danger" data-delete-template="${t.id}">Eliminar</button>
                </div>
              </div>`).join("")}
          </div>
        </div>`;
    }

    function templateFormModal(existing) {
      const overlay = showModal(`
        <h2>${existing ? "Editar plantilla" : "Nueva plantilla"}</h2>
        <div class="field"><label>Nombre</label><input id="tpl-name" value="${existing?.name || ""}" placeholder="Ej: Modelo con logo" /></div>
        <div class="grid grid-2">
          <div class="field"><label>Estilo</label>
            <select id="tpl-layout">
              ${Object.entries(TEMPLATE_LAYOUTS).map(([k, v]) => `<option value="${k}" ${existing?.layout === k ? "selected" : ""}>${v}</option>`).join("")}
            </select>
          </div>
          <div class="field"><label>Color de acento</label><input id="tpl-color" type="color" value="${existing?.accent_color || "#2F5233"}" /></div>
        </div>
        <div class="field"><label>Logo (opcional, imagen)${existing?.has_logo ? " — ya tiene uno cargado; subí otro para reemplazarlo" : ""}</label><input id="tpl-logo" type="file" accept="image/*" /></div>
        <div class="field"><label>Texto de encabezado (opcional)</label><input id="tpl-header" value="${existing?.header_text || ""}" placeholder="Ej: ¡Gracias por elegirnos!" /></div>
        <div class="field"><label>Texto de pie (opcional)</label><input id="tpl-footer" value="${existing?.footer_text || ""}" placeholder="Ej: Seguinos en @nuestra_cuenta" /></div>
        <div class="field"><label><input type="checkbox" id="tpl-default" style="width:auto" ${existing?.is_default ? "checked" : ""} /> Usar como predeterminada</label></div>
        <button class="btn btn-primary" id="tpl-save">Guardar</button>
      `);

      function readLogoAsBase64() {
        return new Promise((resolve) => {
          const file = overlay.querySelector("#tpl-logo").files[0];
          if (!file) return resolve(undefined);
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
      }

      overlay.querySelector("#tpl-save").addEventListener("click", async () => {
        try {
          const logoBase64 = await readLogoAsBase64();
          const body = {
            name: overlay.querySelector("#tpl-name").value,
            layout: overlay.querySelector("#tpl-layout").value,
            accentColor: overlay.querySelector("#tpl-color").value,
            headerText: overlay.querySelector("#tpl-header").value || null,
            footerText: overlay.querySelector("#tpl-footer").value || null,
            isDefault: overlay.querySelector("#tpl-default").checked,
          };
          if (logoBase64 !== undefined) body.logoBase64 = logoBase64;
          if (existing) {
            await apiWithOverride(`/invoice-templates/${existing.id}`, { method: "PATCH", body }, "invoices:manageTemplates");
          } else {
            await apiWithOverride("/invoice-templates", { method: "POST", body }, "invoices:manageTemplates");
          }
          closeModal(overlay);
          await refresh();
          toast("Plantilla guardada.", "success");
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    function wirePlantillas() {
      document.getElementById("add-template").addEventListener("click", () => templateFormModal(null));
      document.querySelectorAll("[data-edit-template]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          try {
            const data = await api(`/invoice-templates/${btn.dataset.editTemplate}`);
            templateFormModal(data.template);
          } catch (err) {
            toast(err.message, "error");
          }
        })
      );
      document.querySelectorAll("[data-default-template]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          try {
            await apiWithOverride(`/invoice-templates/${btn.dataset.defaultTemplate}`, { method: "PATCH", body: { isDefault: true } }, "invoices:manageTemplates");
            await refresh();
            toast("Plantilla marcada como predeterminada.", "success");
          } catch (err) {
            toast(err.message, "error");
          }
        })
      );
      document.querySelectorAll("[data-delete-template]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          if (!confirm("¿Eliminar esta plantilla? Las facturas ya emitidas con ella no se modifican.")) return;
          try {
            await apiWithOverride(`/invoice-templates/${btn.dataset.deleteTemplate}`, { method: "DELETE" }, "invoices:manageTemplates");
            await refresh();
            toast("Plantilla eliminada.", "success");
          } catch (err) {
            toast(err.message, "error");
          }
        })
      );
    }

    const TABS = {
      productos: { render: renderProductos, wire: wireProductos },
      categorias: { render: renderCategorias, wire: wireCategorias },
      adicionales: { render: renderAdicionales, wire: wireAdicionales },
      estaciones: { render: renderEstaciones, wire: wireEstaciones },
      salon: { render: renderSalon, wire: wireSalon },
      inventario: { render: renderInventario, wire: wireInventario },
      reportes: { render: renderReportes, wire: wireReportes },
      usuarios: { render: renderUsuarios, wire: wireUsuarios },
      permisos: { render: renderPermisos, wire: wirePermisos },
      parametros: { render: renderParametros, wire: wireParametros },
      plantillas: { render: renderPlantillas, wire: wirePlantillas },
      auditoria: { render: renderAuditoria, wire: wireAuditoria },
    };
    // Si venimos de un F5/recarga (por ejemplo, al guardar el idioma) y la
    // URL trae #pestaña, arrancamos en esa pestaña en vez de siempre en
    // Productos, para no perder de vista dónde estaba el usuario.
    const initialTabFromHash = location.hash.replace("#", "");
    let activeTab = TABS[initialTabFromHash] ? initialTabFromHash : "productos";

    function renderActiveTab() {
      document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === activeTab));
      document.getElementById("tab-content").innerHTML = TABS[activeTab].render();
      TABS[activeTab].wire();
      history.replaceState(null, "", `#${activeTab}`);
    }

    async function refresh() {
      await loadAll();
      renderActiveTab();
    }

    document.getElementById("tabs").addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON") return;
      if (["usuarios", "permisos", "parametros", "auditoria"].includes(e.target.dataset.tab) && !canManageUsers) return;
      activeTab = e.target.dataset.tab;
      renderActiveTab();
    });

    refresh();
    } // fin del bloque "if (user)"
  </script>
</body>
</html>
