<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos - Gestión Restaurante</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
</head>
<body>
  <div id="app-nav"></div>
  <main class="container">
    <div class="flex-between mb16">
      <h2 style="margin:0" data-i18n="page.pedidos.title">Pedidos</h2>
      <div class="flex-gap">
        <a href="/pages/factura-libre.html" class="btn" data-i18n="pedidos.newFreeInvoiceBtn">+ Nueva factura libre</a>
        <a href="/pages/pos.html?new=1" class="btn btn-primary" data-i18n="pedidos.newRetiroDeliveryBtn">+ Retiro / Delivery</a>
      </div>
    </div>
    <div class="tabs" id="status-tabs">
      <button data-status="ABIERTO" class="active" data-i18n="pedidos.tab.abiertos">Abiertos</button>
      <button data-status="CERRADO" data-i18n="pedidos.tab.cerrados">Cerrados</button>
      <button data-status="CANCELADO" data-i18n="pedidos.tab.cancelados">Cancelados</button>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr><th>#</th><th data-i18n="pedidos.col.type">Tipo</th><th data-i18n="pedidos.col.tableCustomer">Mesa / Cliente</th><th data-i18n="pedidos.col.waiter">Mozo</th><th data-i18n="common.total">Total</th><th data-i18n="common.status">Estado</th><th data-i18n="pedidos.col.invoice">Factura</th><th></th></tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
  </main>

  <script src="/js/socket.io.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const user = requireRole(["ADMIN", "DUENIO", "ENCARGADO", "CAJERO", "MOZO"]);
    if (user) renderNav();
    let currentStatus = "ABIERTO";
    const canInvoice = user && ["ADMIN", "DUENIO", "ENCARGADO", "CAJERO"].includes(user.role);
    if (user && !canInvoice) {
      const freeInvoiceLink = document.querySelector('a[href="/pages/factura-libre.html"]');
      if (freeInvoiceLink) freeInvoiceLink.style.display = "none";
    }

    function typeLabel(type) {
      return (
        {
          SALON: t("pedidos.typeLabel.SALON", "Salón"),
          RETIRO: t("pedidos.typeLabel.RETIRO", "Retiro"),
          DELIVERY: t("pedidos.typeLabel.DELIVERY", "Delivery"),
        }[type] || type
      );
    }

    async function load() {
      const body = document.getElementById("orders-body");
      body.innerHTML = `<tr><td colspan="8">${loadingHTML()}</td></tr>`;
      const data = await api(`/orders?status=${currentStatus}`);
      if (data.orders.length === 0) {
        body.innerHTML = `<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">${t("pedidos.emptyState", "No hay pedidos en este estado.")}</td></tr>`;
        return;
      }
      body.innerHTML = data.orders
        .map(
          (o) => `
        <tr>
          <td>#${o.code}</td>
          <td>${typeLabel(o.type)}</td>
          <td>${o.table_name || o.customer_name || "-"}</td>
          <td>${o.waiter_name || "-"}</td>
          <td>${money(o.total)}</td>
          <td><span class="pill pill-${o.status === "ABIERTO" ? "ocupada" : o.status === "CERRADO" ? "libre" : "pendiente_pago"}">${t("order.status." + o.status, o.status)}</span></td>
          <td>${invoiceCell(o)}</td>
          <td><a class="btn btn-sm" href="/pages/pos.html?orderId=${o.id}">${t("pedidos.viewBtn", "Ver")}</a></td>
        </tr>`
        )
        .join("");
      wireInvoiceButtons();
    }

    // Muestra directamente en la lista, sin tener que entrar al detalle del
    // pedido, la acción de facturación disponible según su estado: emitir
    // factura si está cerrado y no tiene una todavía, o descargarla/enviarla
    // por mail si ya se emitió (esto vale para cualquier tipo de pedido,
    // incluyendo Retiro y Delivery).
    function invoiceCell(o) {
      if (o.status !== "CERRADO" || !canInvoice) return `<span class="small muted">-</span>`;
      if (!o.invoice_id) {
        return `<button class="btn btn-sm btn-primary" data-issue-invoice="${o.id}" data-code="${o.code}" data-customer="${(o.customer_name || "").replace(/"/g, "&quot;")}">${t("pedidos.invoiceBtn", "Facturar")}</button>`;
      }
      return `<span class="flex-gap">
        <span class="small muted">${o.invoice_number}</span>
        <button class="btn btn-sm" data-download-invoice="${o.id}" data-number="${o.invoice_number}">${t("pedidos.pdfBtn", "PDF")}</button>
      </span>`;
    }

    function wireInvoiceButtons() {
      document.querySelectorAll("[data-issue-invoice]").forEach((btn) =>
        btn.addEventListener("click", () => openIssueInvoiceModal(btn.dataset.issueInvoice, btn.dataset.code, btn.dataset.customer, load))
      );
      document.querySelectorAll("[data-download-invoice]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          try {
            const res = await fetch(`/api/orders/${btn.dataset.downloadInvoice}/invoice/pdf`, {
              headers: { Authorization: `Bearer ${getToken()}` },
            });
            if (!res.ok) throw new Error(t("pedidos.downloadError", "No se pudo descargar la factura."));
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `factura-${btn.dataset.number}.pdf`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
          } catch (err) {
            toast(err.message, "error");
          }
        })
      );
    }

    document.getElementById("status-tabs").addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON") return;
      document.querySelectorAll("#status-tabs button").forEach((b) => b.classList.remove("active"));
      e.target.classList.add("active");
      currentStatus = e.target.dataset.status;
      load();
    });

    load();
    const socket = connectSocket();
    if (socket) socket.on("order:updated", load);
  </script>
</body>
</html>
